<title>Casa Cultura · Caucasia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet"><meta name="theme-color" content="#143F3C">
<style>
:root{--papel:#F4F0E6;--sup:#FBF9F3;--tinta:#17211F;--tinta2:#4A5753;--linea:#D8D1C0;--campo:#76827C;--rio:#143F3C;--rio2:#2B6A63;--oro:#D9A432;--oro-osc:#9A6A0B;--flor:#9E1B4A;--ok:#1E5E34;--ok-bg:#E3F0E4;--warn:#7A4B00;--warn-bg:#F8ECCB;--err:#A4262C;--muted:#ECE8DC;--serif:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--sans:'Lato',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;font:400 16px/1.6 var(--sans);color:var(--tinta);background:var(--papel)}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.15;margin:0 0 .6em;letter-spacing:-.01em}
h2{font-size:clamp(1.65rem,3.2vw,2.15rem)}h3{font-size:1.2rem}img{max-width:100%}
a{color:var(--rio2);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--oro-osc);outline-offset:2px;border-radius:2px}#app:focus{outline:none}
header.top :focus-visible,.hero :focus-visible,footer :focus-visible{outline-color:#fff}
.skip{position:absolute;left:12px;top:-64px;background:#fff;color:var(--rio);padding:10px 14px;border-radius:4px;z-index:20;font-weight:600}.skip:focus{top:8px}
.eyebrow{font:600 .75rem/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--oro-osc);margin:0 0 8px}.lead{color:var(--tinta2);margin:-4px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:6px;border:1.5px solid var(--rio);background:var(--rio);color:#fff;font:600 15px/1 var(--sans);cursor:pointer;text-decoration:none;transition:background-color .12s,border-color .12s,color .12s}
.btn:hover{background:#0D2D2B;border-color:#0D2D2B}.btn.alt{background:transparent;color:var(--rio)}.btn.alt:hover{background:var(--rio);color:#fff}
.btn.gold{background:var(--oro);border-color:var(--oro);color:#1B1604}.btn.gold:hover{background:#E8B947;border-color:#E8B947}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}.btn.danger:hover{background:var(--err);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}.btn:active:not(:disabled){transform:translateY(1px)}
header.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px 24px;flex-wrap:wrap;padding:10px max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left));background:var(--rio);color:#fff;border-bottom:3px solid var(--oro)}
.brand{order:1;color:#fff;text-decoration:none;font:700 1.35rem/1.1 var(--serif)}.brand small{display:block;margin-top:4px;font:500 .7rem/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#E9C779}
#nav{order:2;margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}#nav a{color:#E6EFEC;text-decoration:none;font-weight:500;font-size:.95rem;padding:8px 10px;border-bottom:2px solid transparent;transition:border-color .12s,color .12s}
#nav a:hover{color:#fff;border-color:rgba(255,255,255,.45)}#nav a[aria-current]{color:#fff;border-color:var(--oro)}
.logo{order:3;height:56px;width:auto;background:#fff;border-radius:4px;padding:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left))}.wide{max-width:1520px}.pg{padding-top:36px;padding-bottom:80px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero{background:var(--rio);color:#fff;padding:clamp(40px,8vw,88px) 0 clamp(52px,8vw,100px);position:relative}.hero .wrap{display:grid;gap:18px}.hero .eyebrow{color:#E9C779;margin:0}
.hero h1{color:#fff;font-size:clamp(2.2rem,6vw,4.1rem);max-width:16ch;margin:0}.hero p{max-width:36em;color:#D5E4E0;font-size:1.15rem;margin:0}.hero .row{margin-top:6px}
.contour{position:absolute;left:0;bottom:0;width:100%;height:24px}
.sec{padding-top:56px}.sec h2{margin-bottom:22px}
.progs{list-style:none;margin:0;padding:0;counter-reset:p;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:48px;border-top:2px solid var(--tinta)}
.prog{counter-increment:p;display:flex;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--linea);font:400 1.15rem var(--sans)}.prog::before{content:counter(p,decimal-leading-zero);font:600 .78rem var(--sans);color:var(--oro-osc);letter-spacing:.06em}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px 48px;counter-reset:s}.how li{counter-increment:s;border-top:2px solid var(--tinta);padding-top:14px}
.how li::before{content:counter(s);display:block;font:300 2.2rem/1 var(--serif);color:var(--rio2);margin-bottom:10px}.how b{display:block;margin-bottom:2px}.how span{color:var(--tinta2)}
footer{background:var(--tinta);color:#C9D3CF;padding:28px 0;margin-top:72px;font-size:.9rem}footer b{color:#fff;font:700 1.05rem var(--serif)}
.card{background:var(--sup);border:1px solid var(--linea);border-radius:6px;padding:24px}.attn{border-left:4px solid var(--oro-osc)}
label{display:block;font-weight:600;font-size:.95rem;margin:16px 0 6px}.fld label{margin-top:0}.fld{margin-bottom:20px}
input,select{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--campo);border-radius:6px;font:400 16px var(--sans);color:var(--tinta);background:var(--sup);transition:border-color .12s,box-shadow .12s}
input:hover,select:hover{border-color:var(--tinta)}input:focus,select:focus{border-color:var(--rio);box-shadow:0 0 0 3px rgba(43,106,99,.25)}
input[aria-invalid=true],select[aria-invalid=true]{border-color:var(--err);box-shadow:inset 4px 0 0 var(--err)}input::placeholder{color:#76817C}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--rio)}input[type=file]{padding:8px;font-size:15px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
.err{color:var(--err);font-size:.9rem;font-weight:500;margin-top:6px}.err::before{content:"✕ ";font-weight:700}.hint{color:var(--tinta2);font-size:.88rem;margin:6px 0 0}
.form{max-width:680px;margin:0 auto}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 28px}.steps i{height:4px;background:var(--linea);border-radius:2px;transition:background-color .2s}.steps i.on{background:var(--rio2)}
#f{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}#f>*{grid-column:1/-1}#f>.fld.h{grid-column:auto}
.actions{margin-top:28px}
.dl{display:grid;grid-template-columns:140px 1fr;margin:0 0 12px;border-top:1px solid var(--linea)}.dl dt,.dl dd{padding:9px 0;border-bottom:1px solid var(--linea)}.dl dt{color:var(--tinta2);font-size:.9rem}.dl dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ticket{max-width:560px;margin:0 auto;border:1px solid var(--tinta);border-radius:4px;background:var(--sup);padding:28px}.code{font:700 2.3rem/1 var(--serif);color:var(--flor);letter-spacing:.06em;margin:6px 0 18px;padding:14px 0;border-top:2px solid var(--tinta);border-bottom:1px solid var(--linea);overflow-wrap:anywhere}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:.82rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.activo{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}.pill.activo::before{content:"● "}.pill.pendiente{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}.pill.pendiente::before{content:"◐ "}.pill.inactivo{background:var(--muted);color:#4A4A44;border-color:#6B6B63}.pill.inactivo::before{content:"○ "}
dialog{border:1px solid var(--tinta);border-radius:8px;max-width:560px;width:calc(100% - 24px);padding:24px;background:var(--sup);color:var(--tinta);max-height:90vh;overflow-y:auto}dialog::backdrop{background:rgba(20,63,60,.55)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:6px;z-index:30;max-width:calc(100% - 32px);font-size:.95rem;animation:tin .18s ease-out}@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.av{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;object-fit:cover;background:#E3DDCB;color:var(--rio);font:700 1.1rem var(--serif);border:1px solid var(--linea)}
@media(max-width:720px){.brand{font-size:1.15rem;flex:1 1 0;min-width:0}.logo{height:46px;flex:none}#nav{order:4;flex:1 0 100%;margin:0;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.pg{padding-top:24px}.sec{padding-top:44px}.row .btn{flex:1 1 100%}.actions{flex-direction:column-reverse}.dl{grid-template-columns:110px 1fr}}
@media(max-width:640px){#f{grid-template-columns:1fr}#f>.fld.h{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<main id="app" tabindex="-1"></main><footer><div class="wrap"><b>Casa de la Cultura Reinaldo González Guevara</b><br>Caucasia, Antioquia. Sus datos se usan solo para gestionar la participación en los programas.</div></footer><dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const CONSENT_TEXT="BORRADOR — texto por definir por la Casa de la Cultura y su asesor legal. Como acudiente, autorizo el tratamiento de los datos del menor para gestionar su participación en los programas, conforme a la política de tratamiento de datos de la institución y la normativa colombiana aplicable.";
const FAIL=m=>{document.getElementById('app').innerHTML='<div class="wrap" style="padding:40px 20px"><div class="card"><h2>No pudimos cargar la página</h2><p>'+m+'</p><button class="btn" onclick="location.reload()">Reintentar</button></div></div>'};
if(typeof supabase==='undefined'||typeof CFG==='undefined'||/TU_CLAVE|TU-PROYECTO/.test(CFG.key+CFG.url)){FAIL('Revise su conexión a internet y vuelva a intentar. Si el problema sigue, avise a la Casa de la Cultura.');throw new Error('init')}
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null,acts=[],students=[],sort={k:'created_at',d:-1},F={q:'',act:'',col:'',gr:'',st:'',age:''};
const age=d=>Math.floor((Date.now()-new Date(d))/31557600000);
const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)};
const friendly=e=>{const m=e?.message||'';if(!navigator.onLine)return 'Sin conexión a internet. Revise su señal e intente de nuevo.';if(/JWT|expired/i.test(m))return 'Su sesión venció. Salga y vuelva a entrar.';if(e?.status===429)return 'Demasiados intentos. Espere un minuto.';return m.includes('DUPLICADO')?'Ya existe una inscripción con estos datos. Comuníquese con la Casa de la Cultura para confirmarla.':m.includes('JORNADA')?'Elija la jornada: mañana o tarde.':m.includes('DOCUMENTO')?'Escriba el tipo y número de documento.':m.includes('INSTRUMENTO')?'Indique qué instrumento quiere aprender.':m.includes('ARCHIVO')?'Uno de los archivos no es válido. Use fotos o PDF.':m.includes('CONSENTIMIENTO')?'Debe aceptar la autorización del acudiente.':m.includes('FECHA')?'La fecha de nacimiento no es válida.':'No pudimos completar la acción. Revise su conexión e intente de nuevo.'};
async function init(){addEventListener('hashchange',route);route()}
async function loadActs(){const{data,error}=await T(sb.from('activities').select('*').order('name'));if(error)throw error;acts=data||[]}
let rid=0;async function route(){const my=++rid,h=location.hash.slice(2)||'',app=$('#app');app.innerHTML='<p class="wrap" role="status" style="padding:40px 20px">Cargando…</p>';
 try{await loadActs();if(my!==rid)return;(h==='registro'?regForm:landing)()}catch(e){if(my!==rid)return;app.innerHTML='<div class="wrap" style="padding:40px 20px"><div class="card"><h2>No pudimos cargar los datos</h2><p>'+esc(friendly(e))+'</p><button class="btn" id="retry">Reintentar</button></div></div>';$('#retry').onclick=route}
 document.querySelectorAll('#nav a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#/'+h));if(window.__h!==h){window.__h=h;window.scrollTo(0,0)}app.focus({preventScroll:true})}
function landing(){$('#app').innerHTML=`<section class="hero"><div class="wrap"><p class="eyebrow">Caucasia, Antioquia</p><h1>Casa de la Cultura Reinaldo González Guevara</h1><p>Un espacio para aprender, crear y transformar nuestro territorio.</p><div class="row"><a class="btn gold" href="#/registro">Registrar estudiante</a></div></div><svg class="contour" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14C150 2 300 24 450 12S750 0 900 12s250 6 300 0" fill="none" stroke="#D9A432" stroke-width="1.5" opacity=".7"/></svg></section>
<div class="wrap sec"><h2>Programas</h2><ul class="progs">${acts.filter(a=>a.active).map(a=>`<li class="prog">${esc(a.name)}</li>`).join('')}</ul></div>
<div class="wrap sec"><h2>Cómo inscribirse</h2><ol class="how"><li><b>Llene el formulario</b><span>Son cinco pasos cortos y se puede hacer desde el celular.</span></li><li><b>Anote su código</b><span>Al terminar recibirá un código que identifica la inscripción.</span></li><li><b>Espere nuestra llamada</b><span>La Casa de la Cultura confirmará la inscripción por teléfono.</span></li></ol></div>`}
const HALF=new Set(['nombres','apellidos','fecha_nacimiento','doc_tipo','colegio','grado','acudiente_telefono','acudiente_email','activity_id','jornada']);
const HINT={doc_numero:'Solo números, sin puntos ni espacios.',foto:'Opcional. Una foto del estudiante de frente, en JPG o PNG.',acudiente_telefono:'Un número al que podamos llamar o escribir por WhatsApp.',acudiente_email:'Opcional. Solo si desea recibir información por correo.'};
const PH={nombres:'Nombres del estudiante',apellidos:'Apellidos del estudiante',doc_numero:'Ej. 1036123456',colegio:'Institución educativa',grado:'Ej. 7°',barrio:'Barrio o vereda donde vive',acudiente_nombre:'Nombre completo del acudiente',acudiente_telefono:'Ej. 3001234567',acudiente_email:'nombre@correo.com',instrumento:'Ej. guitarra, flauta, tambor'};
const FA=(k,ty)=>`autocomplete="${{acudiente_nombre:'name',acudiente_telefono:'tel',acudiente_email:'email'}[k]||'off'}" ${PH[k]?`placeholder="${PH[k]}"`:''} ${k==='doc_numero'?'inputmode="numeric"':''} ${ty==='tel'?'inputmode="tel"':''} ${ty==='email'?'inputmode="email"':''} ${ty==='file'?'accept="image/jpeg,image/png,image/webp"':''} ${/^(nombres|apellidos|colegio|acudiente_nombre)$/.test(k)?'autocapitalize="words"':''}`;
const STEPS=[{t:'El estudiante',f:[['nombres','Nombres'],['apellidos','Apellidos'],['fecha_nacimiento','Fecha de nacimiento','date'],['doc_tipo','Tipo de documento','select',0,['Tarjeta de identidad','Registro civil','Cédula de ciudadanía','Otro']],['doc_numero','Número de documento','text'],['foto','Foto del estudiante (opcional)','file',1]]},{t:'Información académica',f:[['colegio','Colegio o institución educativa'],['grado','Grado'],['barrio','Barrio o vereda (opcional)','text',1]]},{t:'El acudiente',f:[['acudiente_nombre','Nombre del acudiente'],['acudiente_telefono','Teléfono del acudiente','tel'],['acudiente_email','Correo del acudiente (opcional)','email',1]]},{t:'Actividad cultural',f:[['activity_id','Programa','select'],['jornada','Jornada en la que puede asistir','select',0,['Mañana','Tarde']]]},{t:'Confirmación',f:[]}];
async function shrink(f,max=600){try{const b=await createImageBitmap(f);const r=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(b2=>ok(b2||f),'image/jpeg',.85))}catch{return f}}
function regForm(){let s=0,d={};const app=$('#app');
 const val=(k,v,opt)=>{v=(v||'').trim();if(!v)return opt?'':'Este campo es obligatorio.';
  if(k==='fecha_nacimiento'){const a=age(v);if(isNaN(a)||a<3||a>25)return 'Ingrese una fecha válida (el estudiante debe tener entre 3 y 25 años).'}
  if(k==='doc_numero'&&!/^\d{5,15}$/.test(v.replace(/[\s.]/g,'')))return 'Escriba solo números, sin puntos (ej. 1036123456).';if(k==='acudiente_telefono'&&!/^\+?\d{7,13}$/.test(v.replace(/[\s-]/g,'')))return 'Escriba un teléfono válido, solo números (ej. 3001234567).';
  if(k==='acudiente_email'&&!/^\S+@\S+\.\S+$/.test(v))return 'Escriba un correo válido, como nombre@correo.com.';return ''};
 const draw=()=>{const st=STEPS[s];const f=s===3&&acts.find(a=>a.id===d.activity_id)?.pide_instrumento?[...st.f,['instrumento','Instrumento que quiere aprender o tocar (ej. guitarra, flauta, tambor)','text']]:st.f;app.innerHTML=`<div class="wrap pg"><div class="form"><p class="eyebrow">Inscripción · Paso ${s+1} de ${STEPS.length}</p><h2>${st.t}</h2>${s===0?'<p class="lead">Tenga a la mano el documento de identidad del estudiante.</p>':''}<div class="steps" role="progressbar" aria-label="Progreso de la inscripción" aria-valuenow="${s+1}" aria-valuemin="1" aria-valuemax="5">${[1,2,3,4,5].map(i=>`<i class="${i<=s+1?'on':''}"></i>`).join('')}</div><div id="f">${f.map(([k,l,ty,o,ops])=>`<div class="fld ${HALF.has(k)?'h':''}"><label for="${k}">${l}</label>`+(ty==='select'?`<select id="${k}" aria-describedby="e_${k}"><option value="">Seleccione…</option>${(ops?ops.map(x=>({id:x,name:x})):acts.filter(a=>a.active)).map(a=>`<option value="${esc(a.id)}" ${d[k]===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:`<input id="${k}" type="${ty||'text'}" value="${ty==='file'?'':esc(d[k])}" ${FA(k,ty)} aria-describedby="h_${k} e_${k}">`)+`${HINT[k]?`<p class="hint" id="h_${k}">${HINT[k]}</p>`:''}<div class="err" role="alert" hidden id="e_${k}"></div></div>`).join('')}
 ${s===4?`<dl class="dl"><dt>Estudiante</dt><dd>${esc(d.nombres)} ${esc(d.apellidos)}</dd><dt>Documento</dt><dd>${esc(d.doc_tipo)} ${esc(d.doc_numero)}</dd><dt>Colegio</dt><dd>${esc(d.colegio)} · ${esc(d.grado)}</dd><dt>Acudiente</dt><dd>${esc(d.acudiente_nombre)}</dd><dt>Programa</dt><dd>${esc(acts.find(a=>a.id===d.activity_id)?.name)}${d.jornada?' · '+esc(d.jornada):''}${d.instrumento?' · '+esc(d.instrumento):''}</dd></dl><label for="f_doc">Fotocopia de la tarjeta de identidad (o del documento que tenga) · opcional</label><input id="f_doc" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple><p class="hint">Foto clara o PDF. Puede subir hasta 2 (frente y reverso).</p><div class="err" hidden id="e_f_doc"></div><label for="f_seg">Carné o certificado del seguro médico (EPS o SISBÉN) · opcional</label><input id="f_seg" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><p class="hint">Foto clara o PDF, máximo 5 MB por archivo. Solo los verá el personal autorizado.</p><div class="err" hidden id="e_f_seg"></div><p class="hint">Al enviar, confirma que es el acudiente del estudiante y que los datos son correctos.</p>`:''}</div>
 <div class="row actions">${s?'<button class="btn alt" id="back">Atrás</button>':''}<button class="btn" id="next">${s===4?'Enviar registro':'Continuar'}</button></div></div></div>`;
  $('#f input,#f select')?.focus();$('#f').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='file'){e.preventDefault();$('#next').click()}};if(s===3)$('#activity_id').onchange=e=>{d.activity_id=e.target.value;d.jornada=$('#jornada').value;d.instrumento='';draw()};if(s)$('#back').onclick=()=>{s--;draw()};
  $('#next').onclick=async()=>{let bad=0;for(const[k,,ty,o]of f){d[k]=$('#'+k).value;let m=val(k,d[k],o);if(ty==='file'){const fx=$('#'+k).files[0];if(fx){if(fx.size>15728640||!/^image\/(jpeg|png|webp)$/.test(fx.type))m='Use una foto JPG o PNG (máximo 15 MB).';else d.fotoFile=fx}}const e=$('#e_'+k);e.hidden=!m;e.textContent=m;$('#'+k).setAttribute('aria-invalid',m?'true':'false');if(m)bad=1}
   if(s===4){
    const OKT=/^(image\/(jpeg|png|webp)|application\/pdf)$/,gd=[...$('#f_doc').files],gs=[...$('#f_seg').files];let bad2=0;
    const chk=(id,arr,max,msg)=>{const e=$('#e_'+id);let m='';if(arr.length&&(arr.length>max||arr.some(x=>x.size>5242880||!OKT.test(x.type))))m='Use fotos (JPG, PNG) o PDF de máximo 5 MB'+(max>1?', hasta '+max+' archivos.':'.');e.hidden=!m;e.textContent=m;if(m)bad2=1};
    chk('f_doc',gd,2,'Adjunte la fotocopia del documento de identidad.');chk('f_seg',gs,1,'Adjunte el carné o certificado del seguro médico.');
    if(bad2)return;
    const fl=[...gd.map(x=>['doc',x]),...gs.map(x=>['seguro',x])];
    $('#next').disabled=true;$('#next').textContent='Enviando…';const paths=[];let fotoPath=null;if(d.fotoFile){const fb=await shrink(d.fotoFile);fotoPath='registro/'+uid()+'.'+(fb.type.split('/')[1]||'jpg').replace('jpeg','jpg');const{error:fe}=await sb.storage.from('documentos').upload(fotoPath,fb,{contentType:fb.type});if(fe){$('#next').disabled=false;$('#next').textContent='Enviar registro';toast('No pudimos subir la foto. Intente de nuevo o continúe sin foto.');return}}
    for(const[t,x]of fl){const pth='registro/'+t+'-'+uid()+'.'+(x.type.split('/')[1]||'bin').replace('jpeg','jpg');const{error:ue}=await sb.storage.from('documentos').upload(pth,x,{contentType:x.type});if(ue){$('#next').disabled=false;$('#next').textContent='Enviar registro';toast('No pudimos subir un archivo. Revise su conexión e intente de nuevo.');return}paths.push(pth)}
    const{data,error}=await sb.rpc('register_student',{p:{...d,foto:fotoPath,fotoFile:undefined,doc_numero:d.doc_numero.replace(/[\s.]/g,''),archivos:paths,consentimiento:'true'}});
    if(error){$('#next').disabled=false;$('#next').textContent='Enviar registro';toast(friendly(error));return}
    app.innerHTML=`<div class="wrap pg"><div class="ticket"><p class="eyebrow">Inscripción recibida</p><h2>Registro completado</h2><p style="margin:0">Su código de inscripción es:</p><div class="code" aria-label="Código ${esc(data)}">${esc(data)}</div><p>Anótelo o tome una captura de pantalla: identifica esta inscripción. La Casa de la Cultura confirmará el registro por teléfono.</p><a class="btn" href="#/">Volver al inicio</a></div></div>`;window.scrollTo(0,0);app.focus({preventScroll:true});return}
   if(!bad){s++;draw();window.scrollTo(0,0)}else{const bd=$('#f [aria-invalid=true]');if(bd)bd.focus()}}};draw()}
addEventListener('unhandledrejection',e=>{e.preventDefault();toast('Algo salió mal. Intente de nuevo.')});
const T=(p,ms=15000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Tiempo de espera agotado')),ms))]);
const uid=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
init();
</script></body></html>
